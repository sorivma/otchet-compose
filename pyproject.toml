[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "otchet-compose"
version = "0.3.0"
description = "CLI-генератор отчётов по лабораторным работам в формате DOCX"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-docx>=1.1.0",
    "PyYAML>=6.0.1",
    "jsonschema>=4.22",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.11"]

[project.scripts]
otchet-compose = "otchet_compose.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
otchet_compose = ["schemas/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
